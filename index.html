<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04271A">
<title>Alaa Deals</title>
<link rel="icon" type="image/webp" href="logo-mark.webp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
<style>
/* Layout: emerald rail with the gold AD mark (right, RTL) · ivory working pane · gold reserved for money and the primary action */
:root{
  color-scheme:light;
  --bg:#F7F5EF; --surface:#FFFFFF; --sunk:#F0ECE1; --line:#E4DDCB; --line-2:#EDE8DB;
  --ink:#10251A; --muted:#67756C; --faint:#97A39A;
  --emerald:#0B3D27; --emerald-2:#14603F; --emerald-soft:#E2EFE6;
  --gold:#C9A04A; --gold-deep:#97701F; --gold-soft:#F6EDD5; --gold-ink:#2A1E05;
  --ok:#1D7A4B; --ok-soft:#E1F1E7; --warn:#9C6608; --warn-soft:#FAEFD7; --bad:#B03A35; --bad-soft:#F8E3E1; --info:#2C5C93; --info-soft:#E3EBF5;
  --rail-a:#FFFFFF; --rail-b:#FBF8F0; --rail-ink:#10251A; --rail-muted:#7C8A80; --rail-line:#ECE5D3;
  --shadow:0 1px 2px rgba(16,37,26,.05),0 8px 24px -16px rgba(16,37,26,.18);
  --gold-grad:linear-gradient(135deg,#F2D584 0%,#CFA448 52%,#A27722 100%);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-latin:"Montserrat","Readex Pro",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wordmark{font-family:var(--f-latin);font-weight:700;direction:ltr;letter-spacing:-.2px;line-height:1}
.wordmark .a{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark .d{color:#F4EFE3}
.tagline{font-family:var(--f-latin);font-weight:600;font-size:10px;letter-spacing:4px;color:var(--gold);direction:ltr;display:flex;align-items:center;gap:8px}
.tagline::before,.tagline::after{content:"";height:1px;width:18px;background:currentColor;opacity:.7}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.lbrand{position:relative;overflow:hidden;background:radial-gradient(900px 600px at 70% 20%,#0B4630 0%,transparent 60%),linear-gradient(160deg,var(--rail-b),var(--rail-a));color:var(--rail-ink);padding:48px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;text-align:center}
.lbrand::before{content:"";position:absolute;inset:18px;border:1px solid var(--rail-line);border-radius:18px;pointer-events:none}
.lbrand::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(217,180,90,.10);bottom:-260px;left:-160px;box-shadow:0 0 0 60px rgba(217,180,90,.03),0 0 0 120px rgba(217,180,90,.02)}
.lbrand img{width:min(330px,78%);height:auto;display:block;position:relative;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.lbrand .pitch{position:relative;max-width:30ch;font-family:var(--f-display);font-size:17px;line-height:1.8;color:#D9E3DC;margin:0}
.lbrand .pitch b{color:var(--gold);font-weight:600}
.lform{display:grid;place-items:center;padding:40px 24px;background:var(--bg)}
.login-card{width:100%;max-width:380px;display:grid;gap:18px}
.login-card .eyebrow{font-size:12px;font-weight:600;color:var(--gold-deep);letter-spacing:.4px}
.login-card h2{margin:0;font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.3}
.hint{margin:0;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
label.f{display:grid;gap:7px;font-size:13px;color:var(--muted);font-weight:500}
.in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:15px;transition:border-color .15s,box-shadow .15s}
.in::placeholder{color:var(--faint)}
.in:focus{border-color:var(--emerald-2);outline:none;box-shadow:0 0 0 3px var(--emerald-soft)}
textarea.in{min-height:84px;resize:vertical}
.store-note{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;margin:0}
.store-note i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.mobile-logo{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:var(--r);border:1px solid transparent;background:var(--emerald);color:#F4EFE3;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.12)}
.btn svg{width:16px;height:16px}
.btn.gold{background:var(--gold-grad);color:var(--gold-ink);box-shadow:0 6px 16px -8px rgba(160,118,34,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.6;cursor:wait}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.rail{background:linear-gradient(180deg,var(--rail-b),var(--rail-a));color:var(--rail-ink);padding:26px 16px 18px;display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-inline-start:1px solid var(--rail-line)}
.rail-brand{display:grid;justify-items:center;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--rail-line)}
.rail-brand img{width:96px;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.rail-brand .wordmark{font-size:22px}
.nav-label{font-size:11px;letter-spacing:.6px;color:var(--rail-muted);padding:0 12px;margin-bottom:-14px}
.nav{display:grid;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;background:transparent;border:0;color:var(--rail-ink);cursor:pointer;text-align:right;font-weight:500;transition:background .15s}
.nav button svg{width:19px;height:19px;flex:none;color:var(--rail-muted)}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(217,180,90,0),rgba(217,180,90,.14));color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-16px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold-grad)}
.nav button[aria-current="page"] svg{color:var(--gold)}
.nav .count{margin-inline-start:auto;font-size:11px;color:var(--rail-muted);background:rgba(255,255,255,.06);padding:1px 8px;border-radius:999px}
.rail-foot{margin-top:auto;display:grid;gap:4px;font-size:13px;border-top:1px solid var(--rail-line);padding-top:14px}
.who{display:flex;align-items:center;gap:10px;padding:4px 12px 10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-grad);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.who b{display:block;font-weight:600;color:#fff}
.who span{font-size:12px;color:var(--rail-muted)}
.rail-foot button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--rail-ink);text-align:right;padding:8px 12px;border-radius:8px;cursor:pointer}
.rail-foot button svg{width:17px;height:17px;color:var(--rail-muted)}
.rail-foot button:hover{background:rgba(255,255,255,.05)}

main{min-width:0;padding-block:28px 56px;padding-inline:32px;display:grid;gap:22px;align-content:start;max-width:1320px;width:100%}
.topbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.topbar .t{display:grid;gap:2px}
.topbar .date{font-size:12px;color:var(--gold-deep);font-weight:600;letter-spacing:.3px}
.topbar h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:600;text-wrap:balance;line-height:1.3}
.topbar .sp{flex:1}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:0 1 320px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}
.search .in{padding-inline-start:38px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:7px;border:0;background:transparent;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,37,26,.12)}
.seg .c{font-size:11px;color:var(--faint);margin-inline-start:4px}
.toolbar .sp{flex:1}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1.25fr repeat(3,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow);min-width:0}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--emerald-soft);color:var(--emerald-2)}
.kpi .ic svg{width:18px;height:18px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:radial-gradient(400px 200px at 0% 0%,rgba(217,180,90,.18),transparent 60%),linear-gradient(150deg,#0B4630,#04271A);border-color:#0B3D27;color:#EEF2EC}
.kpi.hero .l,.kpi.hero .s{color:#A9C2B3}
.kpi.hero .ic{background:rgba(217,180,90,.16);color:#E6C06A}
.kpi.hero .v{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:34px}
.kpi.hero .v small{color:#C9D7CE;-webkit-text-fill-color:#C9D7CE}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:20px;display:grid;gap:16px;min-width:0;align-content:start;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px}
.panel h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.panel-h .sp{flex:1}
.link{background:none;border:0;color:var(--emerald-2);font-weight:600;font-size:13px;cursor:pointer;padding:4px}
.link:hover{text-decoration:underline}
.pipe{display:grid;gap:12px}
.pipe-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--emerald-2)}
.pipe-row .n{color:var(--muted);font-size:12px;min-width:92px;text-align:left}
.feed{display:grid}
.feed-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px;min-width:0}
.feed-item:last-child{border:0}
.feed-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-item .t small{color:var(--muted);font-size:12px;display:block}
.ini{width:34px;height:34px;border-radius:50%;background:var(--emerald-soft);color:var(--emerald-2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;font-family:var(--f-display)}
.empty{color:var(--muted);font-size:14px;padding:26px 8px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty svg{width:34px;height:34px;color:var(--gold)}

/* Tables */
.tbl-wrap{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:11.5px;font-weight:600;color:var(--muted);padding:12px 16px;background:var(--sunk);white-space:nowrap;letter-spacing:.3px;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-top:1px solid var(--line-2);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in srgb,var(--gold-soft) 35%,transparent)}
.cell-person{display:flex;align-items:center;gap:11px;min-width:0}
.cell-person .main{font-weight:600}
.namebtn{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:right;color:var(--ink)}
.namebtn:hover{color:var(--emerald-2);text-decoration:underline}
td .sm{font-size:12px;color:var(--muted)}
td.act{white-space:nowrap;text-align:left}
.icon-btn{background:transparent;border:0;padding:7px;border-radius:8px;cursor:pointer;color:var(--faint)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad);background:var(--bad-soft)}
.icon-btn svg{width:16px;height:16px;display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-acc{background:var(--emerald-soft);color:var(--emerald-2)}
.p-mute{background:var(--sunk);color:var(--muted)}
.p-gold{background:var(--gold-soft);color:var(--gold-deep)}
select.stage{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;background:var(--surface);cursor:pointer;color:var(--ink)}
.money{color:var(--gold-deep);font-weight:600}
.cur{font-size:11px;color:var(--faint);margin-inline-start:3px;font-weight:500}

/* Board */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;min-width:1340px}
.col{background:var(--sunk);border:1px solid var(--line-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:180px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 8px;border-bottom:1px solid var(--line)}
.col-h b{font-size:13px}
.col-h .c{font-size:11px;color:var(--muted);background:var(--surface);border-radius:999px;padding:1px 8px}
.col-h .sum{margin-inline-start:auto;font-size:11px;color:var(--gold-deep);font-weight:600}
.dcard{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;display:grid;gap:6px;box-shadow:0 1px 2px rgba(16,37,26,.05)}
.dcard .who2{font-weight:600;font-size:14px}
.dcard .u{font-size:12px;color:var(--muted)}
.dcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dcard select.stage{padding:3px 8px;font-size:11px}

/* Modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(3,20,13,.55);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.modal{width:100%;max-width:580px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:rise .18s ease}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.modal-h .mk{width:34px;height:34px;border-radius:9px;background:var(--emerald);color:var(--gold);display:grid;place-items:center}
.modal-h .mk svg{width:18px;height:18px}
.modal-h h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;flex:1}
.modal-b{padding:20px 22px;display:grid;gap:14px}
.modal-f{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line-2);background:var(--sunk);border-radius:0 0 16px 16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.scrim.side{place-items:stretch;justify-items:start;padding:0}
.drawer{width:min(440px,100%);height:100%;overflow:auto;background:var(--surface);border-inline-end:1px solid var(--line);display:grid;align-content:start;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dr-h{background:linear-gradient(150deg,#0B4630,#04271A);color:#EEF2EC;padding:24px 22px 20px;display:grid;gap:12px;position:relative}
.dr-h .x{position:absolute;inset-inline-end:14px;top:14px;color:#C9D7CE}
.dr-h .x:hover{background:rgba(255,255,255,.08);color:#fff}
.dr-h h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.dr-h .ph{display:flex;align-items:center;gap:8px;color:#E6C06A}
.copy{background:rgba(255,255,255,.08);border:0;color:#EEF2EC;border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer}
.dr-b{padding:20px 22px;display:grid;gap:18px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:11px 13px;display:grid;gap:2px}
.facts span{font-size:11.5px;color:var(--muted)}
.facts b{font-weight:600;font-size:14px}
.facts .full{grid-column:1/-1}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--emerald);color:#F4EFE3;padding:11px 20px;border-radius:999px;font-size:14px;z-index:60;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px -10px rgba(0,0,0,.5);animation:rise .2s ease}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* Phone */
.tabbar,.mhead{display:none}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  #login{grid-template-columns:1fr}
  .lbrand{padding:36px 24px 30px;gap:16px}
  .lbrand img{width:200px}
  .lbrand .pitch{font-size:15px}
}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-inline:16px;padding-block:0 100px;gap:18px}
  .mhead{display:flex;align-items:center;gap:10px;margin-inline:-16px;padding:12px 16px;background:linear-gradient(160deg,var(--rail-b),var(--rail-a));position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid var(--rail-line)}
  .mhead img{width:40px;height:auto}
  .mhead .wordmark{font-size:18px}
  .mhead .sp{flex:1}
  .mhead .icon-btn{color:var(--rail-muted)}
  .mhead .icon-btn:hover{background:rgba(255,255,255,.06);color:#fff}
  .topbar h2{font-size:22px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}

const snake=k=>k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());
const camel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
function toRow(o){const r={};for(const[k,v]of Object.entries(o)){let val=v;if((NUMS.includes(k)||DATES.includes(k)||/Id$/.test(k))&&(v===''||v==null))val=null;r[snake(k)]=val}return r}
function fromRow(r){const o={};for(const[k,v]of Object.entries(r))o[camel(k)]=v==null?'':(NUMS.includes(camel(k))?Number(v):v);return o}
async function loadTable(t){
  const {data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});
  if(error){console.error(error);toast('تعذّر تحميل البيانات');return}
  S[t]=data.map(fromRow);
}
async function loadAll(){await Promise.all(TABLES.map(loadTable));render()}
let channel=null;
function subscribe(){
  if(channel)return;
  channel=sb.channel('alaa-deals');
  TABLES.forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},async()=>{await loadTable(t);render()}));
  channel.subscribe();
}
async function save(col,obj){
  obj.updatedAt=new Date().toISOString();
  const {error}=await sb.from(col).upsert(toRow(obj));
  if(error){handleErr(error);return}
  const a=S[col];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.unshift(obj);render();
}
async function remove(col,id){
  const {error}=await sb.from(col).delete().eq('id',id);
  if(error){handleErr(error);return}
  S[col]=S[col].filter(x=>x.id!==id);render();
}
function handleErr(e){console.error(e);toast(e&&e.code==='42501'?'مش مسموح بالحفظ، سجّل دخولك تاني':'تعذّر الحفظ، حاول مرة أخرى')}
const toEmail=u=>u.includes('@')?u.trim().toLowerCase():u.trim().toLowerCase().replace(/\s+/g,'')+'@'+(CFG.usernameDomain||'alaadeals.app');
async function initStore(){
  if(!window.supabase||!CFG.supabaseUrl||!CFG.supabaseAnonKey||CFG.supabaseUrl.includes('YOUR-')||CFG.supabaseAnonKey.includes('YOUR-')){
    $('#loginHint').textContent='السيستم لسه مش متوصل بـ Supabase. حط بيانات المشروع في ملف config.js.';
    $('#storeNote').innerHTML='<i style="background:var(--bad)"></i>غير متصل بقاعدة البيانات';return;
  }
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  $('#lbtn').disabled=false;
  $('#loginHint').textContent='سجّل دخولك عشان تكمّل شغلك.';
  $('#storeNote').innerHTML='<i></i>متصل بقاعدة البيانات';
  const {data:{session}}=await sb.auth.getSession();
  if(session)enterApp(session.user);
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_OUT'&&!$('#app').hidden)showLogin()});
}

/* ---------- login ---------- */
let user='';
const nameOf=u=>(u&&u.user_metadata&&u.user_metadata.name)||(u&&u.email?u.email.split('@')[0]:'');
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=$('#lu').value.trim(),p=$('#lp').value;$('#lerr').textContent='';
  if(!u||!p||!sb)return;
  $('#lbtn').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:toEmail(u),password:p});
  $('#lbtn').disabled=false;
  if(error){$('#lerr').textContent=/Invalid login/i.test(error.message)?'اسم المستخدم أو كلمة السر غير صحيحة':'تعذّر تسجيل الدخول: '+error.message;return}
  enterApp(data.user);
});
async function enterApp(u){user=nameOf(u);$('#login').hidden=true;$('#app').hidden=false;$('#lp').value='';render();await loadAll();subscribe()}
function showLogin(){closeModal();$('#app').hidden=true;$('#login').hidden=false}
async function logout(){if(sb)await sb.auth.signOut();user='';S.clients=[];S.units=[];S.deals=[];showLogin()}

/* ---------- navigation ---------- */
const VIEWS=[['dash','الرئيسية'],['clients','العملاء'],['units','الوحدات'],['deals','الصفقات']];
let view='dash';
const ui={q:{clients:'',units:'',deals:''},f:{clients:'الكل',units:'الكل',deals:'المفتوحة'},dealsMode:ls.get('ad_dmode')||'board'};
function renderNav(){
  const counts={clients:S.clients.length,units:S.units.filter(u=>u.status==='متاحة').length,deals:S.deals.filter(d=>OPEN_STAGES.includes(d.stage)).length};
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-view="${k}" ${view===k?'aria-current="page"':''}>${I[k]}<span>${l}</span>${counts[k]!=null?`<span class="count num">${counts[k]}</span>`:''}</button>`).join('');
  $('#tabbar').innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-view="${k}" ${view===k?'aria-current="page"':''}>${I[k]}<span>${l}</span></button>`).join('');
  $('#whoName').textContent=user||'';$('#av').textContent=(user||'?').trim().charAt(0).toUpperCase();
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;closeModal();render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='logout')logout();
  else if(act==='settings')openSettings();
  else if(act==='add')openForm(a.dataset.col,null,a.dataset.pre?JSON.parse(a.dataset.pre):null);
  else if(act==='edit')openForm(a.dataset.col,id);
  else if(act==='del')confirmDel(a.dataset.col,id);
  else if(act==='chip'){ui.f[view]=a.dataset.v;renderList()}
  else if(act==='close')closeModal();
  else if(act==='goto'){view=a.dataset.v;render()}
  else if(act==='client')openClient(id);
  else if(act==='dmode'){ui.dealsMode=a.dataset.v;ls.set('ad_dmode',ui.dealsMode);render()}
  else if(act==='copy'){const t=a.dataset.t;const ok=()=>toast('تم نسخ الرقم');
    try{navigator.clipboard.writeText(t).then(ok,()=>toast(t))}catch(err){toast(t)}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.q[view]=e.target.value;renderList()}});
document.addEventListener('change',async e=>{
  if(e.target.matches('select.stage')){
    const d=S.deals.find(x=>x.id===e.target.dataset.id);if(!d)return;
    const nd={...d,stage:e.target.value};
    if(nd.stage==='تم البيع'&&!nd.closedAt)nd.closedAt=today();
    await save('deals',nd);await syncUnit(nd);toast('اتنقلت الصفقة لمرحلة «'+nd.stage+'»');
  }
});
async function syncUnit(d){
  const u=S.units.find(x=>x.id===d.unitId);if(!u)return;
  let st=u.status;
  if(d.stage==='عربون')st='محجوزة';else if(d.stage==='تم البيع')st='مباعة';else if(d.stage==='ملغاة'&&u.status==='محجوزة')st='متاحة';
  if(st!==u.status)await save('units',{...u,status:st});
}
const cName=id=>{const c=S.clients.find(x=>x.id===id);return c?c.name:'عميل محذوف'};
const uName=id=>{const u=S.units.find(x=>x.id===id);return u?u.title:'وحدة محذوفة'};
const sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);

/* ---------- render ---------- */

  if($('#app').hidden)return;
  renderNav();
  const m=$('#main');
  const mh=`<div class="mhead"><img src="${MARK}" alt=""><div class="wordmark"><span class="a">Alaa</span> <span class="d">Deals</span></div><span class="sp"></span><button class="icon-btn" type="button" title="الإعدادات" data-act="settings">${I.gear}</button><button class="icon-btn" type="button" title="خروج" data-act="logout">${I.out}</button></div>`;
  const banner=false?'<div class="banner">وضع محلي: البيانات محفوظة على هذا المتصفح فقط. افتح السيستم من رابطه على Claude عشان الحفظ السحابي.</div>':'';
  if(view==='dash'){m.innerHTML=mh+banner+renderDash();return}
  const meta={clients:['العملاء','عميل جديد'],units:['الوحدات','وحدة جديدة'],deals:['الصفقات','صفقة جديدة']}[view];
  const ph={clients:'ابحث بالاسم أو رقم الموبايل',units:'ابحث بالعنوان أو المنطقة',deals:'ابحث بالعميل أو الوحدة'}[view];
  const sub={clients:`${S.clients.length} عميل مسجّل`,units:`${S.units.filter(u=>u.status==='متاحة').length} متاحة من ${S.units.length}`,deals:`${S.deals.filter(d=>OPEN_STAGES.includes(d.stage)).length} صفقة مفتوحة`}[view];
  const toggle=view==='deals'?`<div class="seg" role="group" aria-label="طريقة العرض"><button type="button" data-act="dmode" data-v="board" aria-pressed="${ui.dealsMode==='board'}">${I.board.replace('<svg','<svg width="15" height="15" style="vertical-align:-3px"')} لوحة</button><button type="button" data-act="dmode" data-v="list" aria-pressed="${ui.dealsMode==='list'}">${I.list.replace('<svg','<svg width="15" height="15" style="vertical-align:-3px"')} قائمة</button></div>`:'';
  m.innerHTML=mh+banner+`
   <header class="topbar"><div class="t"><span class="date">${esc(sub)}</span><h2>${meta[0]}</h2></div><span class="sp"></span>
    <div class="actions">${toggle}<button class="btn gold" type="button" data-act="add" data-col="${view}">${I.plus}${meta[1]}</button></div></header>
   <div class="toolbar"><div class="search">${I.search}<input class="in" id="search" type="search" placeholder="${ph}" value="${esc(ui.q[view])}" aria-label="بحث"></div><span class="sp"></span><div id="chips"></div></div>
   <div id="list"></div>`;
  renderList();
}
function chipsFor(){
  if(view==='clients')return['الكل',...CLIENT_TYPES].map(c=>[c,c==='الكل'?S.clients.length:S.clients.filter(x=>x.type===c).length]);
  if(view==='units')return['الكل',...UNIT_STATUS].map(c=>[c,c==='الكل'?S.units.length:S.units.filter(x=>x.status===c).length]);
  const opts=ui.dealsMode==='board'?['المفتوحة','الكل']:['المفتوحة','الكل','تم البيع','ملغاة'];
  return opts.map(c=>[c,c==='الكل'?S.deals.length:c==='المفتوحة'?S.deals.filter(d=>OPEN_STAGES.includes(d.stage)).length:S.deals.filter(d=>d.stage===c).length]);
}
function renderList(){
  const el=$('#list');if(!el)return;
  const chips=chipsFor();
  if(!chips.some(c=>c[0]===ui.f[view]))ui.f[view]=chips[0][0];
  $('#chips').innerHTML=`<div class="seg" role="group" aria-label="فلتر">${chips.map(([c,n])=>`<button type="button" data-act="chip" data-v="${esc(c)}" aria-pressed="${ui.f[view]===c}">${esc(c)}<span class="c num">${n}</span></button>`).join('')}</div>`;
  const q=ui.q[view].trim().toLowerCase(),f=ui.f[view];
  const act=(col,id)=>`<td class="act"><button class="icon-btn" type="button" title="تعديل" data-act="edit" data-col="${col}" data-id="${id}">${I.edit}</button><button class="icon-btn del" type="button" title="حذف" data-act="del" data-col="${col}" data-id="${id}">${I.del}</button></td>`;
  let rows,html;
  if(view==='clients'){
    rows=S.clients.filter(c=>(f==='الكل'||c.type===f)&&(!q||[c.name,c.phone,c.want,c.notes].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    html=rows.length?`<div class="tbl-wrap"><table><thead><tr><th>العميل</th><th>النوع</th><th>الحالة</th><th>المصدر</th><th>الميزانية</th><th>المطلوب</th><th>صفقات</th><th></th></tr></thead><tbody>${rows.map(c=>{
      const dc=S.deals.filter(d=>d.clientId===c.id).length;
      return `<tr><td class="first"><div class="cell-person"><span class="ini">${ini(c.name)}</span><div><button class="namebtn" type="button" data-act="client" data-id="${c.id}">${esc(c.name)}</button><div class="sm num">${esc(c.phone)}</div></div></div></td>
      <td data-l="النوع">${pill(c.type)}</td><td data-l="الحالة">${pill(c.status)}</td><td data-l="المصدر">${esc(c.source||'—')}</td>
      <td data-l="الميزانية">${c.budget?egp(c.budget):'—'}</td><td data-l="المطلوب"><span class="sm">${esc(c.want||'—')}</span></td>
      <td data-l="صفقات" class="num">${dc}</td>${act('clients',c.id)}</tr>`}).join('')}</tbody></table></div>`:emptyState('clients');
  }else if(view==='units'){
    rows=S.units.filter(u=>(f==='الكل'||u.status===f)&&(!q||[u.title,u.area,u.type,u.notes,u.ownerId?cName(u.ownerId):''].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    html=rows.length?`<div class="tbl-wrap"><table><thead><tr><th>الوحدة</th><th>النوع</th><th>المساحة</th><th>السعر</th><th>سعر المتر</th><th>المالك</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(u=>`
      <tr><td class="first"><div class="main" style="font-weight:600">${esc(u.title)}</div><div class="sm">${esc(u.area||'')}${u.floor?' · الدور '+esc(u.floor):''}</div></td>
      <td data-l="النوع">${esc(u.type||'—')}</td><td data-l="المساحة" class="num">${u.size?fmt(u.size)+' م²':'—'}</td>
      <td data-l="السعر">${u.price?egp(u.price):'—'}</td>
      <td data-l="سعر المتر"><span class="sm num">${u.price&&u.size?fmt(Math.round(u.price/u.size)):'—'}</span></td>
      <td data-l="المالك">${u.ownerId&&S.clients.find(c=>c.id===u.ownerId)?`<button class="namebtn" type="button" data-act="client" data-id="${u.ownerId}" style="font-weight:500">${esc(cName(u.ownerId))}</button>`:'—'}</td>
      <td data-l="الحالة">${pill(u.status)}</td>${act('units',u.id)}</tr>`).join('')}</tbody></table></div>`:emptyState('units');
  }else{
    const match=d=>!q||[cName(d.clientId),uName(d.unitId),d.notes].join(' ').toLowerCase().includes(q);
    if(ui.dealsMode==='board'){
      const stages=f==='المفتوحة'?OPEN_STAGES:STAGES;
      rows=S.deals.filter(d=>stages.includes(d.stage)&&match(d));
      html=S.deals.length?`<div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${stages.length},minmax(230px,1fr));min-width:${stages.length*242}px">${stages.map(s=>{
        const ds=rows.filter(d=>d.stage===s).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
        return `<section class="col"><div class="col-h">${pill(s)}<span class="c num">${ds.length}</span><span class="sum">${ds.length?moneyH(sum(ds,'value')):''}</span></div>
        ${ds.map(d=>`<article class="dcard"><div class="row"><button class="namebtn who2" type="button" data-act="client" data-id="${d.clientId}">${esc(cName(d.clientId))}</button><button class="icon-btn" type="button" title="تعديل" data-act="edit" data-col="deals" data-id="${d.id}">${I.edit}</button></div>
          <div class="u">${esc(uName(d.unitId))}</div>
          <div class="row"><span>${d.value?egp(d.value):'<span class="sm">بدون قيمة</span>'}</span><span class="sm num">${esc(d.date||'')}</span></div>
          <select class="stage" data-id="${d.id}" aria-label="مرحلة الصفقة">${STAGES.map(x=>`<option ${x===d.stage?'selected':''}>${x}</option>`).join('')}</select></article>`).join('')||'<div class="sm" style="color:var(--faint);text-align:center;padding:14px 0">لا يوجد</div>'}</section>`}).join('')}</div></div>`:emptyState('deals');
    }else{
      rows=S.deals.filter(d=>(f==='الكل'||(f==='المفتوحة'?OPEN_STAGES.includes(d.stage):d.stage===f))&&match(d)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      html=rows.length?`<div class="tbl-wrap"><table><thead><tr><th>العميل / الوحدة</th><th>المرحلة</th><th>قيمة الصفقة</th><th>العمولة</th><th>التاريخ</th><th></th></tr></thead><tbody>${rows.map(d=>`
        <tr><td class="first"><div class="cell-person"><span class="ini">${ini(cName(d.clientId))}</span><div><button class="namebtn" type="button" data-act="client" data-id="${d.clientId}">${esc(cName(d.clientId))}</button><div class="sm">${esc(uName(d.unitId))}</div></div></div></td>
        <td data-l="المرحلة"><select class="stage" data-id="${d.id}" aria-label="مرحلة الصفقة">${STAGES.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select></td>
        <td data-l="القيمة">${d.value?egp(d.value):'—'}</td><td data-l="العمولة">${d.commission?egp(d.commission):'—'}</td>
        <td data-l="التاريخ" class="num">${esc(d.date||'')}</td>${act('deals',d.id)}</tr>`).join('')}</tbody></table></div>`:emptyState('deals');
    }
  }
  el.innerHTML=html;
}
function emptyState(col){
  const anyData=S[col].length>0;
  const t={clients:['لسه مفيش عملاء','سجّل أول عميل بالاسم ورقم الموبايل.','عميل جديد'],units:['لسه مفيش وحدات','أضف أول وحدة بالسعر والمساحة.','وحدة جديدة'],deals:['لسه مفيش صفقات','اربط عميل بوحدة وابدأ أول صفقة.','صفقة جديدة']}[col];
  if(anyData)return `<div class="panel"><div class="empty">${I.search}مفيش نتائج تطابق البحث أو الفلتر.</div></div>`;
  return `<div class="panel"><div class="empty">${I[col]}<div><b style="color:var(--ink);font-family:var(--f-display)">${t[0]}</b><br>${t[1]}</div><button class="btn gold sm" type="button" data-act="add" data-col="${col}">${I.plus}${t[2]}</button></div></div>`;
}
function renderDash(){
  const open=S.deals.filter(d=>OPEN_STAGES.includes(d.stage));
  const won=S.deals.filter(d=>d.stage==='تم البيع');
  const ym=today().slice(0,7);

  const follow=S.clients.filter(c=>c.status==='جديد'||c.status==='متابعة').length;
  const conv=S.deals.length?Math.round(won.length/S.deals.length*100):0;
  const max=Math.max(1,...STAGES.map(s=>S.deals.filter(d=>d.stage===s).length));
  const pipe=STAGES.map(s=>{const ds=S.deals.filter(d=>d.stage===s);

  const recent=[...S.clients].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);
  const hot=[...open].sort((a,b)=>STAGES.indexOf(b.stage)-STAGES.indexOf(a.stage)||(b.value||0)-(a.value||0)).slice(0,6);
  const hr=new Date().getHours();
  return `
  <header class="topbar"><div class="t"><span class="date">${esc(dateAr())}</span><h2>${hr<12?'صباح الخير':'مساء الخير'} يا ${esc(user||'')}</h2></div><span class="sp"></span>
   <div class="actions"><button class="btn ghost" type="button" data-act="add" data-col="clients">${I.plus}عميل</button>
   <button class="btn ghost" type="button" data-act="add" data-col="units">${I.plus}وحدة</button>
   <button class="btn gold" type="button" data-act="add" data-col="deals">${I.plus}صفقة جديدة</button></div></header>
  <div class="kpis">
   <div class="kpi hero"><div class="top"><span class="l">عمولة الشهر</span><span class="ic">${I.coin}</span></div><span class="v">${moneyH(sum(wonM,'commission'))}<small>ج.م</small></span><span class="s">${wonM.length} صفقة اتقفلت · مبيعات ${money(sum(wonM,'value'))} ج.م</span></div>
   <div class="kpi"><div class="top"><span class="l">صفقات مفتوحة</span><span class="ic">${I.deals}</span></div><span class="v num">${open.length}</span><span class="s">قيمتها ${money(sum(open,'value'))} ج.م</span></div>
   <div class="kpi"><div class="top"><span class="l">العملاء</span><span class="ic">${I.clients}</span></div><span class="v num">${S.clients.length}</span><span class="s">${follow} محتاج متابعة</span></div>
   <div class="kpi"><div class="top"><span class="l">وحدات متاحة</span><span class="ic">${I.units}</span></div><span class="v num">${avail}<small>/ ${S.units.length}</small></span><span class="s">نسبة الإغلاق ${conv}%</span></div>
  </div>

let W=null;
const fx=(x,v)=>typeof x==='function'?x(v):x;
function openForm(col,id,pre){

const vis=()=>steps(W.col,W.rec).filter(s=>!s.when||s.when(W.v));
function showVal(s,v){
  const x=v[s.k];

function drawWiz(){
  const el=$('#wiz');if(!el)return;

     <div class="wiz-b"><div class="wiz-step">${W.rec?'راجع وعدّل اللي محتاجه':'كله تمام؟'}</div><h3 class="wiz-q">${W.rec?'بيانات '+esc(W.v.name||W.v.title||cName(W.v.clientId)):'راجع البيانات قبل الحفظ'}</h3>

  const s=st[W.i],v=W.v,val=v[s.k]??'';

    ctl=`<div class="opts">${s.opts.map(([ov,od,oi,dot])=>`<button type="button" class="opt" data-w="pick" data-v="${esc(ov)}" aria-pressed="${ov===val}">${oi?`<span class="oi">${oi}</span>`:(dot||'')}<span><b>${esc(ov)}</b>${od?`<small>${esc(od)}</small>`:''}</span></button>`).join('')}</div>`;
  }else if(s.t==='pick'){
    const items=s.items();

   ${ctl}<p class="wiz-err" id="werr"></p></div>

   ${s.opt&&(val===''||val==null)&&s.t!=='choice'?`<button class="btn ghost" type="button" data-w="skip">تخطّي</button>`:''}

  if(s.t==='pick')drawPick();

function updReadout(){
  const ro=$('#wro');if(!ro)return;
  const s=vis()[W.i];const v=W.v[s.k];
  let h='';
  if(v!==''&&v!=null&&s.t==='money')h=`<b>${money(v)}</b> جنيه`;
  const ex=s.extra?s.extra(W.v):'';
  ro.innerHTML=[h,ex].filter(Boolean).join(' · ');
}
function readInput(){
  const s=vis()[W.i];const el=$('#wi');if(!el)return;
  let x=el.value;
  if(s.t==='money'||s.t==='num'){const d=x.replace(/[^\d.٠-٩]/g,'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));W.v[s.k]=d===''?'':Number(d)}
  else if(s.t==='tel')W.v[s.k]=x.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^\d+]/g,'');
  else W.v[s.k]=x.trim();
}
function wErr(m){const e=$('#werr');if(e)e.textContent=m;const b=$('#wiz .wiz-b');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
function wNext(){
  readInput();
  const st=vis(),s=st[W.i],v=W.v[s.k];
  if(s.req&&(v===''||v==null)){wErr(s.t==='pick'?'اختار من القايمة':'السؤال ده مطلوب');return}
  if(s.check){const m=s.check(W.v);if(m){wErr(m);return}}
  W.dir=1;W.q='';
  if(W.backTo){W.backTo=false;W.review=true;drawWiz();return}
  if(W.i>=vis().length-1){W.review=true}else W.i++;
  drawWiz();
}
function wPrev(){readInput();W.dir=-1;W.q='';if(W.review){W.review=false;W.i=vis().length-1}else if(W.i>0)W.i--;drawWiz()}
async function wSave(){
  const col=W.col,rec=W.rec;const o={...W.v};
  if(!o.id){o.id=uid();o.createdAt=new Date().toISOString()}
  if(col==='deals'&&o.stage==='تم البيع'&&!o.closedAt)o.closedAt=o.date||today();
  for(const s of steps(col,rec)){if(s.when&&!s.when(o))o[s.k]=''}
  const missing=vis().find(s=>s.req&&(o[s.k]===''||o[s.k]==null));
  if(missing){W.review=false;W.i=vis().indexOf(missing);drawWiz();wErr('السؤال ده مطلوب');return}
  const btn=$('[data-w="save"]');if(btn)btn.disabled=true;
  closeModal();W=null;await save(col,o);if(col==='deals')await syncUnit(o);
  toast(rec?'تم حفظ التعديلات':{clients:'العميل اتسجّل',units:'الوحدة اتضافت',deals:'الصفقة اتسجّلت'}[col]);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-w]');if(!b||!W)return;
  const a=b.dataset.w,s=W.review?null:vis()[W.i];
  if(a==='next')wNext();
  else if(a==='prev')wPrev();
  else if(a==='skip'){W.v[s.k]='';W.dir=1;if(W.backTo){W.backTo=false;W.review=true}else if(W.i>=vis().length-1)W.review=true;else W.i++;drawWiz()}
  else if(a==='save')wSave();
  else if(a==='goto'){W.review=false;W.i=+b.dataset.i;W.backTo=true;W.dir=-1;drawWiz()}
  else if(a==='pick'){W.v[s.k]=b.dataset.v;document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));setTimeout(wNext,170)}
  else if(a==='pickid'){W.v[s.k]=b.dataset.v;s.onPick&&s.onPick(W.v,b.dataset.v);document.querySelectorAll('.pitem').forEach(x=>x.setAttribute('aria-pressed',x===b));setTimeout(wNext,170)}
  else if(a==='chip'){const n=(s.t==='money'||s.t==='num')?Number(b.dataset.v):b.dataset.v;W.v[s.k]=n;const i=$('#wi');if(i)i.value=(s.t==='money'||s.t==='num')?fmt(n):n;document.querySelectorAll('.qchip').forEach(x=>x.setAttribute('aria-pressed',x===b));updReadout();if(s.t!=='money'&&s.t!=='num')setTimeout(wNext,170)}
});
document.addEventListener('input',e=>{
  if(!W)return;
  if(e.target.id==='wq'){W.q=e.target.value;drawPick()}
  else if(e.target.id==='wi'){readInput();const s=vis()[W.i];
    if(s.t==='money'||s.t==='num'){const v=W.v[s.k];const pos=e.target.value.length;e.target.value=v===''?'':fmt(v);updReadout()}
    $('#werr')&&($('#werr').textContent='');document.querySelectorAll('.qchip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===String(W.v[s.k])))}
});
document.addEventListener('keydown',e=>{
  if(!W||e.key!=='Enter')return;
  const t=e.target;
  if(t.tagName==='TEXTAREA'&&!(e.ctrlKey||e.metaKey))return;
  if(t.closest&&t.closest('button'))return;
  e.preventDefault();
  if(W.review)wSave();else wNext();
});

function confirmDel(col,id){
  const rec=S[col].find(x=>x.id===id);if(!rec)return;
  const name=rec.name||rec.title||cName(rec.clientId);
  const linked=col==='clients'?S.deals.filter(d=>d.clientId===id).length:col==='units'?S.deals.filter(d=>d.unitId===id).length:0;
  showModal(`<div class="modal" role="alertdialog" aria-modal="true" style="max-width:440px"><div class="modal-h"><span class="mk" style="background:var(--bad-soft);color:var(--bad)">${I.del}</span><h3>حذف «${esc(name)}»؟</h3></div>
   <div class="modal-b"><p class="hint">${linked?`مرتبط بـ ${linked} صفقة، وهتفضل الصفقات موجودة بس من غير ${col==='clients'?'اسم العميل':'اسم الوحدة'}. `:''}الحذف نهائي ومش هينفع ترجعه.</p></div>
   <div class="modal-f"><button class="btn danger" type="button" id="yesDel">حذف نهائي</button><button class="btn ghost" type="button" data-act="close">إلغاء</button></div></div>`);
  $('#yesDel').addEventListener('click',async()=>{closeModal();await remove(col,id);toast('تم الحذف')});
}
function openSettings(){
  showModal(`<form class="modal" id="sform" style="max-width:440px"><div class="modal-h"><span class="mk">${I.gear}</span><h3>تغيير كلمة السر</h3><button class="icon-btn" type="button" data-act="close" title="إغلاق">${I.x}</button></div>
   <div class="modal-b">
   <p class="hint">مسجّل باسم <b>${esc(user)}</b></p>
   <label class="f">كلمة السر الجديدة<input class="in" id="s_new" type="password" required minlength="6" autocomplete="new-password"></label>
   <label class="f">تأكيد كلمة السر<input class="in" id="s_new2" type="password" required autocomplete="new-password"></label>
   <p class="err" id="serr"></p></div>
   <div class="modal-f"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" data-act="close">إلغاء</button></div></form>`);
  $('#sform').addEventListener('submit',async e=>{
    e.preventDefault();
    const np=$('#s_new').value;
    if(np.length<6){$('#serr').textContent='كلمة السر 6 حروف أو أكثر';return}
    if(np!==$('#s_new2').value){$('#serr').textContent='كلمتا السر غير متطابقتين';return}
    const {error}=await sb.auth.updateUser({password:np});
    if(error){$('#serr').textContent='تعذّر التغيير: '+error.message;return}
    closeModal();toast('تم تغيير كلمة السر');
  });
}
function showModal(h,side,cls){$('#layer').innerHTML=`<div class="scrim${side?' side':''}${cls?' '+cls:''}" id="scrim">${h}</div>`;$('#scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')closeModal()})}
function closeModal(){$('#layer').innerHTML='';W=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

initStore();
})();
</script>

</body>
</html>
